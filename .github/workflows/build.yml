name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;33.0.2" "build-tools;35.0.0"
      - name: Build
        run: |
          unzip -q Snowstorm-snowman.zip
          cd Snowstorm-main
          bash build.sh
        env:
          D8_VERSION: "35.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: Snowstorm-apk
          path: Snowstorm-main/build/Snowstorm.apk
